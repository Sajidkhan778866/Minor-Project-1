version: '3.9'
services:
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ai_study_strategist
      AI_SERVICE_URL: http://python-ai-service:8000
    depends_on:
      - mongodb
      - python-ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - '5174:5180'
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_AI_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  python-ai-service:
    build:
      context: ../python-ai-service
      dockerfile: ../docker/Dockerfile.python
    ports:
      - '8000:8000'
    restart: unless-stopped

volumes:
  mongo_data:
