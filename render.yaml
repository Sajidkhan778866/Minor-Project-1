services:
  # Node.js Backend API
  - type: web
    name: ai-study-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: ai-study-python
          envVarKey: RENDER_EXTERNAL_URL

  # Python AI Service
  - type: web
    name: ai-study-python
    env: python
    rootDir: python-ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false

  # React Frontend
  - type: web
    name: ai-study-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-study-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_AI_URL
        fromService:
          type: web
          name: ai-study-python
          envVarKey: RENDER_EXTERNAL_URL
