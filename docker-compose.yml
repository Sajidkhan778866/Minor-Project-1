services:
  mongodb:
    image: mongo:7
    container_name: ai_study_strategist_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  python-ai-service:
    build:
      context: ./python-ai-service
      dockerfile: ../docker/Dockerfile.python
    container_name: ai_study_strategist_nlp
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: ai_study_strategist_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/ai_study_strategist
      - AI_SERVICE_URL=http://python-ai-service:8000
    depends_on:
      - mongodb
      - python-ai-service
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: ai_study_strategist_frontend
    ports:
      - "5174:5180"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_AI_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
